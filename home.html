<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Issue Tracker </title>

     <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

    <!-- tailwidn and daisy-ui -->

    <!-- font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- fontawesome icon -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body class = "min-h-screen bg-base-200 mx-auto">
    <header class="border-b-2 border-gray-300 sticky z-10 top-0 bg-base-200">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center" >

            <div class="left flex gap-2 items-center">
                <div class="logo w-[40px]">
                    <img src="./assets/github-logo.png" alt="">
                </div>
                <div class="logo-title">
                    <p class="font-bold text-2xl">GitHub Issues Tracker</p>
                </div>

            </div>

            <div class="right flex gap-2">
                <div>
                    <label class="input">
                    <input id="input-search" type="text" required placeholder="Search issues" />
                    </label>
                </div>
                <div>
                   <button id="search-btn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> New Issue</button> 
                </div>
            </div>
        
        </section>
    </header>

    <main>
        <section id="allCards" class ="w-9/12 mx-auto z-0 py-10 space-y-5">
            <!-- Tab Button Started -->
            <div class="card card-border border-gray-300 bg-base-100 p-2  mx-auto">
            
                <div class="tabs p-5 flex gap-2">
                            <button onclick="getToggleButtonId('all-tab-btn')" id="all-tab-btn" class="btn flex-col btn-info text-white h-full py-2 btn-lg">
                                <p>All</p>
                            </button>
                            <button onclick="getToggleButtonId('open-tab-btn')" id="open-tab-btn" class="btn flex-col btn-soft text-gray-600  h-full py-2 btn-lg">
                                <p>Open</p>
                            </button>
                            <button onclick="getToggleButtonId('closed-tab-btn')" id="closed-tab-btn" class="btn flex-col btn-soft text-gray-600  h-full py-2 btn-lg">
                                <p>Closed</p>
                            </button>
                </div>

            </div>
            <!-- Tab Button Ended -->

            <div class="card card-border border-gray-300 bg-base-100 p-2 mx-auto">
                
                <div class="flex justify-between items-center p-5">
                    <div>
                        <div class="flex gap-1 items-center">
                    <div class="w-[30px]">
                    <img src="./assets/Aperture.png" alt="">
                    </div>
                    <div>
                        <p id="total-issues" class="font-bold text-xl"><span id="total-count">0</span> <span id="issue-text">Issues</span></p>
                        <p class="text-sm text-gray-500">Track and manage your project Issues</p>
                    </div>
                </div>
                    </div>
                    <div class="flex gap-4 items-center">
                        <div class="flex gap-1 items-center">
                            <div class="w-4 h-4 rounded-full bg-green-600 "></div>
                            <div><p>Open</p></div>
                        </div>
                        <div class="flex gap-1 items-center">
                            <div class="w-4 h-4 rounded-full bg-red-600 "></div>
                            <div><p>Closed</p></div>
                        </div>
                        
                        
                        
                    </div>
                    
                </div>
            </div>
        </sections> 

        <!-- Spinner starts -->

         <section id="spinner_section" class="flex justify-center items-center py-10 ">
            <span class="loading loading-spinner text-primary"></span>
            <span class="loading loading-spinner text-secondary"></span>
            <span class="loading loading-spinner text-accent"></span>
            <span class="loading loading-spinner text-neutral"></span>
            <span class="loading loading-spinner text-info"></span>
            <span class="loading loading-spinner text-success"></span>
            <span class="loading loading-spinner text-warning"></span>
            <span class="loading loading-spinner text-error"></span>
         </section>

         <!-- Spinner Ends -->
        
        <section id="all-issue-container" class="grid grid-cols-3 gap-4">
        </section>

        <section id="open-issue-container" class="grid grid-cols-3 gap-4 ">
        </section>

        <section id="closed-issue-container" class="grid grid-cols-3 gap-4 ">
        </section>

        <section id="search-issue-container" class="grid grid-cols-3 gap-4 ">
        </section>

        <!-- Open the modal using ID.showModal() method -->
            <!-- <button class="btn" onclick="my_modal_5.showModal()">open modal</button> -->
            <dialog id="details_modal" class="modal modal-bottom sm:modal-middle">
            <div class="modal-box">
                <section id="allCards" class ="w-10/12 mx-auto py-5 space-y-1">
                    <div id="modal-details-container">

                    </div>
                </section>
                
                <div class="modal-action">
                <form method="dialog">
                    <!-- if there is a button in form, it will close the modal -->
                    <button class="btn btn-primary">Close</button>
                </form>
                </div>
            </div>
            </dialog>
        
    </main>


<script src="./script/loadissues.js"></script>
</body>
</html>
