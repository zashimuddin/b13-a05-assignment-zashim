     <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

    <!-- tailwidn and daisy-ui -->

    <!-- font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- fontawesome icon -->

<body class = "min-h-screen bg-base-200 mx-auto">
    <header class="border-b-2 border-gray-300 sticky z-10 top-0 bg-base-200">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center" >

            <div class="left flex gap-2 items-center">
                <div class="logo w-[40px]">
                    <img src="./assets/github-logo.png" alt="">
                </div>
                <div class="logo-title">
                    <p class="font-bold text-2xl">GitHub Issues Tracker</p>
                </div>

            </div>

            <div class="right flex gap-2">
                <div>
                    <label class="input">
                    <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <g
                        stroke-linejoin="round"
                        stroke-linecap="round"
                        stroke-width="2.5"
                        fill="none"
                        stroke="currentColor"
                        >
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                        </g>
                    </svg>
                    <input type="search" required placeholder="Search" />
                    </label>
                </div>
                
                <div>
                   <button class="btn btn-primary"><i class="fa-solid fa-plus"></i> New Issue</button> 
                </div>
            </div>
        
        </section>
    </header>

    <main>
        <section id="allCards" class ="w-9/12 mx-auto z-0 py-10 space-y-5">
            <!-- Tab Button Started -->
            <div class="card card-border border-gray-300 bg-base-100 p-2  mx-auto">
            
                <div class="tabs p-5 flex gap-2">
                            <button onclick="toggleStyle('all-tab-btn')" id="all-tab-btn" class="btn flex-col btn-info text-white h-full py-2 btn-lg">
                                <p>All</p>
                            </button>
                            <button onclick="toggleStyle('open-tab-btn')" id="open-tab-btn" class="btn flex-col btn-soft text-gray-600  h-full py-2 btn-lg">
                                <p>Open</p>
                            </button>
                            <button onclick="toggleStyle('closed-tab-btn')" id="closed-tab-btn" class="btn flex-col btn-soft text-gray-600  h-full py-2 btn-lg">
                                <p>Closed</p>
                            </button>
                </div>

            </div>
            <!-- Tab Button Ended -->

            <div class="card card-border border-gray-300 bg-base-100 p-2 mx-auto">
                <div class="flex gap-1 p-5 items-center">
                    <div class="w-[30px]">
                    <img src="./assets/Aperture.png" alt="">
                    </div>
                    <div>
                        <p id="total-issues" class="font-bold text-xl"><span>0</span> Issues</p>
                        <p class="text-sm text-gray-500">Track and manage your project Issues</p>
                    </div>
                </div>
            </div>
        </sections> 
        
        <section id="issue-container" class="grid grid-cols-3 gap-4">

        </section>
        
    </main>


<script src="./script/loadissues.js"></script>
</body>
</html>
